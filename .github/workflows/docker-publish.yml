name: Publish Docker image to GHCR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract OctoPrint version from Dockerfile
        id: get_version
        run: |
          OCTOPRINT_VERSION=$(grep -o 'octoprint/octoprint:[^@]\+' Dockerfile | cut -d':' -f2)
          echo "OctoPrint Version: $OCTOPRINT_VERSION"
          if [ -z "$OCTOPRINT_VERSION" ]; then 
            echo "Failed to extract OctoPrint version" >&2
            exit 1
          fi
          echo "octoprint_version=$OCTOPRINT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: |
            ghcr.io/kvanzuijlen/octoprint-bambu:${{ steps.get_version.outputs.octoprint_version }}-${{ github.run_number }}
            ghcr.io/kvanzuijlen/octoprint-bambu:latest
            ghcr.io/kvanzuijlen/octoprint-bambu:${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.created=${{ github.event.repository.created_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.get_version.outputs.octoprint_version }}-${{ github.run_number }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.get_version.outputs.octoprint_version }}-${{ github.run_number }}
          name: OctoPrint Bambu - ${{ steps.get_version.outputs.octoprint_version }}-${{ github.run_number }}
          body: |
            Docker image for OctoPrint Bambu based on OctoPrint version ${{ steps.get_version.outputs.octoprint_version }}.
            Build number: ${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
  
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    if: ${{ github.event_name == 'pull_request' }}
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  
      - name: Extract OctoPrint version from Dockerfile
        id: get_version
        run: |
          OCTOPRINT_VERSION=$(grep -o 'octoprint/octoprint:[^@]\+' Dockerfile | cut -d':' -f2)
          echo "OctoPrint Version: $OCTOPRINT_VERSION"
          if [ -z "$OCTOPRINT_VERSION" ]; then 
            echo "Failed to extract OctoPrint version" >&2
            exit 1
          fi
          echo "octoprint_version=$OCTOPRINT_VERSION" >> "$GITHUB_OUTPUT"
  
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
  
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: |
            ghcr.io/kvanzuijlen/octoprint-bambu:${{ steps.get_version.outputs.octoprint_version }}-${{ github.run_number }}
            ghcr.io/kvanzuijlen/octoprint-bambu:latest
            ghcr.io/kvanzuijlen/octoprint-bambu:${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.created=${{ github.event.repository.created_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.get_version.outputs.octoprint_version }}-${{ github.run_number }}
