name: Publish Docker image to GHCR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract OctoPrint version from Dockerfile
        id: get_version
        run: |
          OCTOPRINT_VERSION=$(grep -o 'octoprint/octoprint:[^@]\+' Dockerfile | cut -d':' -f2)
          echo "OctoPrint Version: $OCTOPRINT_VERSION"
          if [ -z "$OCTOPRINT_VERSION" ]; then 
            echo "Failed to extract OctoPrint version" >&2
            exit 1
          fi
          echo "octoprint_version=$OCTOPRINT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: |
            ghcr.io/kvanzuijlen/octoprint-bambu:${{ steps.get_version.outputs.octoprint_version }}-${{ github.run_number }}
            ghcr.io/kvanzuijlen/octoprint-bambu:latest
            ghcr.io/kvanzuijlen/octoprint-bambu:${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.created=${{ github.event.repository.created_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.get_version.outputs.octoprint_version }}-${{ github.run_number }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ steps.get_version.outputs.octoprint_version }}-${{ github.run_number }}
          name: OctoPrint Bambu - ${{ steps.get_version.outputs.octoprint_version }}-${{ github.run_number }}
          body: |
            Docker image for OctoPrint Bambu based on OctoPrint version ${{ steps.get_version.outputs.octoprint_version }}.
            Build number: ${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
  
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    if: ${{ github.event_name == 'pull_request' }}
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  
      - name: Extract OctoPrint version from Dockerfile
        id: get_version
        run: |
          OCTOPRINT_VERSION=$(grep -o 'octoprint/octoprint:[^@]\+' Dockerfile | cut -d':' -f2)
          echo "OctoPrint Version: $OCTOPRINT_VERSION"
          if [ -z "$OCTOPRINT_VERSION" ]; then 
            echo "Failed to extract OctoPrint version" >&2
            exit 1
          fi
          echo "octoprint_version=$OCTOPRINT_VERSION" >> "$GITHUB_OUTPUT"
  
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
  
      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: |
            ghcr.io/kvanzuijlen/octoprint-bambu:${{ steps.get_version.outputs.octoprint_version }}-${{ github.run_number }}
            ghcr.io/kvanzuijlen/octoprint-bambu:latest
            ghcr.io/kvanzuijlen/octoprint-bambu:${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.created=${{ github.event.repository.created_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.get_version.outputs.octoprint_version }}-${{ github.run_number }}
